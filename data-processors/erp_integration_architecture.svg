<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="11">
  <rect width="1000" height="680" fill="#f4f6fb"/>
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">ERP Integration Architecture – EV Charging Station Supply Chain</text>
  <text x="500" y="50" text-anchor="middle" font-size="10" fill="#555">How SAP/ERP documents flow across the supply chain lifecycle</text>

  <!-- ═══ ERP CORE (centre) ═════════════════════════════════════════════════ -->
  <rect x="370" y="260" width="260" height="160" rx="10" fill="#1a237e" stroke="#0d47a1" stroke-width="2"/>
  <text x="500" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ERP SYSTEM CORE</text>
  <text x="500" y="302" text-anchor="middle" font-size="9" fill="#90caf9">(e.g. SAP S/4HANA)</text>
  <text x="390" y="322" font-size="9" fill="#e3f2fd">▸ Purchase Orders (MM)</text>
  <text x="390" y="337" font-size="9" fill="#e3f2fd">▸ Production Orders (PP)</text>
  <text x="390" y="352" font-size="9" fill="#e3f2fd">▸ Inventory / WM</text>
  <text x="390" y="367" font-size="9" fill="#e3f2fd">▸ Quality Notifications (QM)</text>
  <text x="390" y="382" font-size="9" fill="#e3f2fd">▸ Goods Movements (GR/GI)</text>
  <text x="390" y="397" font-size="9" fill="#e3f2fd">▸ Plant Maintenance (PM)</text>

  <!-- ═══ UPSTREAM SUPPLIERS (left) ════════════════════════════════════════ -->
  <!-- Steel Supplier -->
  <rect x="30" y="80" width="160" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">Steel Supplier Alpha</text>
  <text x="110" y="116" text-anchor="middle" font-size="9" fill="#1565c0">Essen, Germany (A1)</text>
  <text x="110" y="128" text-anchor="middle" font-size="8" fill="#555">EDI-860 PO / ASN</text>

  <!-- Electronics -->
  <rect x="30" y="155" width="160" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="177" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">Electronics Mfr. E</text>
  <text x="110" y="191" text-anchor="middle" font-size="9" fill="#1565c0">Brno, Czech Rep. (A5)</text>
  <text x="110" y="203" text-anchor="middle" font-size="8" fill="#555">API → PO / QN / GR</text>

  <!-- Cable Workshop -->
  <rect x="30" y="230" width="160" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">Cable Workshop F</text>
  <text x="110" y="266" text-anchor="middle" font-size="9" fill="#1565c0">Wrocław, Poland (A6)</text>
  <text x="110" y="278" text-anchor="middle" font-size="8" fill="#555">EDI-850 PO / SFG GR</text>

  <!-- Plastic Factory -->
  <rect x="30" y="305" width="160" height="55" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="110" y="327" text-anchor="middle" font-size="10" font-weight="bold" fill="#bf360c">Plastic Factory C</text>
  <text x="110" y="341" text-anchor="middle" font-size="9" fill="#e65100">Ho Chi Minh City (A3)</text>
  <text x="110" y="353" text-anchor="middle" font-size="8" fill="#555">Sea freight – ASN / GR</text>

  <!-- Coating -->
  <rect x="30" y="380" width="160" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="402" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">Coating Supplier G</text>
  <text x="110" y="416" text-anchor="middle" font-size="9" fill="#1565c0">Stuttgart, Germany (A7)</text>
  <text x="110" y="428" text-anchor="middle" font-size="8" fill="#555">Subcontracting order (SC)</text>

  <!-- arrows supplier → ERP -->
  <line x1="190" y1="107" x2="370" y2="310" stroke="#1565c0" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <line x1="190" y1="182" x2="370" y2="320" stroke="#1565c0" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <line x1="190" y1="257" x2="370" y2="330" stroke="#1565c0" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <line x1="190" y1="332" x2="370" y2="340" stroke="#e65100" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowO)"/>
  <line x1="190" y1="407" x2="370" y2="350" stroke="#1565c0" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>

  <!-- ═══ ASSEMBLY & PRODUCTION (bottom centre) ════════════════════════════ -->
  <rect x="340" y="460" width="320" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="500" y="484" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">EuroCharge Assembly (A8)</text>
  <text x="500" y="498" text-anchor="middle" font-size="9" fill="#2e7d32">Budapest, Hungary | Production Order → GI → FG Stock</text>
  <text x="500" y="512" text-anchor="middle" font-size="8" fill="#555">ERP: PROD-xxxxxx | Plant PLANT-HU01</text>

  <line x1="500" y1="420" x2="500" y2="460" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="500" y1="460" x2="500" y2="420" stroke="#2e7d32" stroke-width="1.5"/>

  <!-- ERP → Assembly -->
  <line x1="500" y1="420" x2="500" y2="460" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrowG)"/>

  <!-- ═══ TESTING / QUALITY (right-low) ════════════════════════════════════ -->
  <rect x="690" y="455" width="180" height="70" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="780" y="476" text-anchor="middle" font-size="10" font-weight="bold" fill="#b71c1c">VDE Testing (A9)</text>
  <text x="780" y="490" text-anchor="middle" font-size="9" fill="#c62828">Frankfurt, Germany</text>
  <text x="780" y="504" text-anchor="middle" font-size="8" fill="#555">QM: Test result → Release</text>
  <text x="780" y="517" text-anchor="middle" font-size="8" fill="#555">or QN if fail</text>

  <line x1="660" y1="490" x2="690" y2="490" stroke="#c62828" stroke-width="1.3" marker-end="url(#arrowR)"/>
  <!-- QN back to ERP -->
  <line x1="690" y1="470" x2="630" y2="400" stroke="#c62828" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>

  <!-- ═══ LOGISTICS (right-top) ════════════════════════════════════════════ -->
  <rect x="690" y="80" width="180" height="70" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="780" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a148c">TransLogistics EU</text>
  <text x="780" y="119" text-anchor="middle" font-size="9" fill="#6a1b9a">Hamburg (A10)</text>
  <text x="780" y="133" text-anchor="middle" font-size="8" fill="#555">Delivery Order / GI 601</text>
  <text x="780" y="145" text-anchor="middle" font-size="8" fill="#555">Shipment doc → WM</text>

  <line x1="630" y1="300" x2="690" y2="130" stroke="#6a1b9a" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowP)"/>

  <!-- ═══ OPERATOR / MAINTENANCE (right) ════════════════════════════════════ -->
  <rect x="690" y="200" width="180" height="70" rx="6" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
  <text x="780" y="225" text-anchor="middle" font-size="10" font-weight="bold" fill="#004d40">EuroCharge Operator</text>
  <text x="780" y="239" text-anchor="middle" font-size="9" fill="#00695c">Munich (A13)</text>
  <text x="780" y="253" text-anchor="middle" font-size="8" fill="#555">PM Order → Maintenance</text>
  <text x="780" y="265" text-anchor="middle" font-size="8" fill="#555">Notification → Asset</text>

  <line x1="630" y1="320" x2="690" y2="250" stroke="#00695c" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowT)"/>

  <!-- ═══ EOL (bottom right) ════════════════════════════════════════════════ -->
  <rect x="690" y="330" width="260" height="90" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1.5"/>
  <text x="820" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">End-of-Life Cluster</text>
  <text x="700" y="370" font-size="9" fill="#bf360c">▸ European Recycling Hub (A15)</text>
  <text x="700" y="384" font-size="9" fill="#bf360c">▸ Materials Recovery Inc (A16)</text>
  <text x="700" y="398" font-size="9" fill="#bf360c">▸ Waste Disposal Provider (A17)</text>
  <text x="700" y="412" font-size="8" fill="#555">ERP: Decommission order → WEEE doc</text>

  <line x1="630" y1="390" x2="690" y2="375" stroke="#f57f17" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowO)"/>

  <!-- ═══ LEGEND ════════════════════════════════════════════════════════════ -->
  <rect x="30" y="470" width="290" height="115" rx="6" fill="white" stroke="#bbb" stroke-width="1"/>
  <text x="45" y="490" font-size="10" font-weight="bold" fill="#333">Legend – ERP Document Types</text>
  <line x1="45" y1="505" x2="75" y2="505" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="80" y="508" font-size="9" fill="#333">Purchase Order / ASN / GR (MM)</text>
  <line x1="45" y1="521" x2="75" y2="521" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="80" y="524" font-size="9" fill="#333">Production Order / GI (PP)</text>
  <line x1="45" y1="537" x2="75" y2="537" stroke="#c62828" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="80" y="540" font-size="9" fill="#333">Quality Notification / Test Result (QM)</text>
  <line x1="45" y1="553" x2="75" y2="553" stroke="#6a1b9a" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="80" y="556" font-size="9" fill="#333">Shipment / Delivery Order (LE/WM)</text>
  <line x1="45" y1="569" x2="75" y2="569" stroke="#f57f17" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="80" y="572" font-size="9" fill="#333">EOL / WEEE Decommission Order (PM)</text>

  <!-- arrow markers -->
  <defs>
    <marker id="arrowB" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#1565c0"/></marker>
    <marker id="arrowG" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2e7d32"/></marker>
    <marker id="arrowR" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#c62828"/></marker>
    <marker id="arrowP" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#6a1b9a"/></marker>
    <marker id="arrowT" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#00695c"/></marker>
    <marker id="arrowO" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f57f17"/></marker>
  </defs>
</svg>

<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="11">
  <rect width="900" height="580" fill="#f8f9fa"/>
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">End-of-Life Material Recovery Flow</text>
  <text x="450" y="46" text-anchor="middle" font-size="10" fill="#555">DC-50kW unit | Total mass: 78.3 kg (excl. concrete base)</text>

  <!-- ── COLLECTED UNIT (left) ──────────────────────────────────────────── -->
  <rect x="20" y="200" width="130" height="80" rx="8" fill="#ff8f00" stroke="#e65100" stroke-width="2"/>
  <text x="85" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="white">EVC Unit</text>
  <text x="85" y="248" text-anchor="middle" font-size="10" fill="#fff3e0">Collected</text>
  <text x="85" y="264" text-anchor="middle" font-size="10" fill="#fff3e0">78.3 kg total</text>

  <!-- ── DISMANTLING (centre-left) ─────────────────────────────────────── -->
  <rect x="200" y="190" width="140" height="100" rx="8" fill="#455a64" stroke="#263238" stroke-width="2"/>
  <text x="270" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Dismantling</text>
  <text x="270" y="238" text-anchor="middle" font-size="9" fill="#cfd8dc">Facility O | Budapest</text>
  <text x="270" y="256" font-size="9" fill="#eceff1"> ⚡ 4.2 kWh electricity</text>
  <text x="270" y="270" font-size="9" fill="#eceff1"> 👷 Manual separation</text>

  <!-- arrow collected → dismantling -->
  <line x1="150" y1="240" x2="200" y2="240" stroke="#e65100" stroke-width="2" marker-end="url(#arrowD)"/>
  <text x="175" y="235" text-anchor="middle" font-size="8" fill="#555">P23</text>

  <!-- ── MATERIAL FRACTIONS (top/right of dismantling) ─────────────────── -->
  <!-- Steel 28.4 kg → recycled 25.0 -->
  <rect x="400" y="60" width="140" height="60" rx="6" fill="#b0bec5" stroke="#546e7a" stroke-width="1.5"/>
  <text x="470" y="84" text-anchor="middle" font-size="10" font-weight="bold" fill="#263238">Steel / Metal</text>
  <text x="470" y="99" text-anchor="middle" font-size="9" fill="#37474f">28.4 kg total</text>
  <line x1="340" y1="210" x2="400" y2="90" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrowS)"/>

  <!-- Electronics 18.7 kg → recycled 13.5 -->
  <rect x="400" y="140" width="140" height="60" rx="6" fill="#90caf9" stroke="#1565c0" stroke-width="1.5"/>
  <text x="470" y="164" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">Electronics</text>
  <text x="470" y="179" text-anchor="middle" font-size="9" fill="#1565c0">18.7 kg total</text>
  <line x1="340" y1="225" x2="400" y2="170" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Cables 8.4 kg → recovered 5.5 -->
  <rect x="400" y="220" width="140" height="60" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="470" y="244" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">Cables</text>
  <text x="470" y="259" text-anchor="middle" font-size="9" fill="#bf360c">8.4 kg total</text>
  <line x1="340" y1="240" x2="400" y2="250" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrowO)"/>

  <!-- Plastic 11.2 kg → partial -->
  <rect x="400" y="300" width="140" height="60" rx="6" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="470" y="324" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">Plastic</text>
  <text x="470" y="339" text-anchor="middle" font-size="9" fill="#2e7d32">11.2 kg total</text>
  <line x1="340" y1="260" x2="400" y2="330" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Other / residual 11.6 kg -->
  <rect x="400" y="380" width="140" height="60" rx="6" fill="#ef9a9a" stroke="#c62828" stroke-width="1.5"/>
  <text x="470" y="404" text-anchor="middle" font-size="10" font-weight="bold" fill="#b71c1c">Residual / Other</text>
  <text x="470" y="419" text-anchor="middle" font-size="9" fill="#c62828">11.6 kg total</text>
  <line x1="340" y1="275" x2="400" y2="410" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- ── RECOVERY OUTCOMES (right) ──────────────────────────────────────── -->
  <!-- Recycling Facility P -->
  <rect x="600" y="80" width="180" height="220" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="690" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">Recycling Facility P</text>
  <text x="690" y="118" text-anchor="middle" font-size="9" fill="#2e7d32">Hamburg, Germany (A15)</text>
  <text x="615" y="138" font-size="9" fill="#333">Steel recovered:    25.0 kg  (88%)</text>
  <text x="615" y="153" font-size="9" fill="#333">Electronics recov.: 13.5 kg  (72%)</text>
  <text x="615" y="168" font-size="9" fill="#333">Cables recovered:    5.5 kg  (65%)</text>
  <text x="615" y="183" font-size="9" fill="#333">Plastic recovered:   4.7 kg  (42%)</text>
  <line x1="615" y1="192" x2="770" y2="192" stroke="#ccc" stroke-width="0.8"/>
  <text x="615" y="208" font-size="9" fill="#1b5e20" font-weight="bold">Total recovered:    48.7 kg</text>
  <text x="615" y="223" font-size="9" fill="#555">CO₂ avoided: –95 kg CO₂-eq</text>
  <text x="615" y="238" font-size="9" fill="#555">Recycling credit: +€127</text>
  <text x="615" y="253" font-size="8" fill="#888">ISO 14001 / WEEE certified</text>
  <text x="615" y="268" font-size="8" fill="#888">ERP: WEEE compliance doc</text>
  <text x="615" y="285" font-size="8" fill="#888">issued per EU directive</text>

  <!-- arrows fractions → recycling -->
  <line x1="540" y1="90" x2="600" y2="140" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="540" y1="170" x2="600" y2="165" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="540" y1="250" x2="600" y2="190" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="540" y1="330" x2="600" y2="210" stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#arrowG)"/>

  <!-- Waste Disposal Provider Q -->
  <rect x="600" y="340" width="180" height="120" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="690" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">Waste Disposal Q</text>
  <text x="690" y="378" text-anchor="middle" font-size="9" fill="#c62828">Rotterdam, Netherlands (A17)</text>
  <text x="615" y="398" font-size="9" fill="#333">Residual:   11.6 kg (disposed)</text>
  <text x="615" y="413" font-size="9" fill="#333">Plastic residual: 6.5 kg</text>
  <line x1="615" y1="422" x2="770" y2="422" stroke="#eee" stroke-width="0.8"/>
  <text x="615" y="438" font-size="9" fill="#b71c1c" font-weight="bold">Total to landfill/thermal: 18.1 kg</text>
  <text x="615" y="453" font-size="8" fill="#555">CO₂ from disposal: +22.8 kg</text>

  <line x1="540" y1="410" x2="600" y2="410" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="540" y1="330" x2="620" y2="375" stroke="#c62828" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrowR)"/>

  <!-- ── SUMMARY BOX ─────────────────────────────────────────────────────── -->
  <rect x="20" y="490" width="860" height="70" rx="6" fill="white" stroke="#bbb" stroke-width="1.2"/>
  <text x="450" y="511" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">EOL Mass Balance Summary (DC-50kW unit, 78.3 kg)</text>
  <text x="140" y="530" text-anchor="middle" font-size="10" fill="#1b5e20">Recovered / recycled: 48.7 kg (62%)</text>
  <text x="380" y="530" text-anchor="middle" font-size="10" fill="#c62828">Disposed: 18.1 kg (23%)</text>
  <text x="600" y="530" text-anchor="middle" font-size="10" fill="#1565c0">Process loss: 11.5 kg (15%)</text>
  <text x="140" y="548" text-anchor="middle" font-size="9" fill="#555">CO₂ avoided (credit): –95 kg</text>
  <text x="380" y="548" text-anchor="middle" font-size="9" fill="#555">CO₂ from disposal: +22.8 kg</text>
  <text x="600" y="548" text-anchor="middle" font-size="9" fill="#555">Net EOL GWP: +24 kg CO₂-eq</text>

  <!-- markers -->
  <defs>
    <marker id="arrowD" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#e65100"/></marker>
    <marker id="arrowS" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#546e7a"/></marker>
    <marker id="arrowB" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1565c0"/></marker>
    <marker id="arrowO" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#e65100"/></marker>
    <marker id="arrowG" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2e7d32"/></marker>
    <marker id="arrowR" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#c62828"/></marker>
  </defs>
</svg>
